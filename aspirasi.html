<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aspirasi MPK MAN Bandung Barat</title>
    
    <link rel="stylesheet" href="background.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
</head>
<body class="p-6 md:p-12 bg-[#050505] text-white">
    <div class="max-w-2xl mx-auto" id="main-content">
        <header class="text-center mb-12">
             <div class="flex justify-center space-x-6 mb-6">
                <div class="w-24 h-24 flex items-center justify-center drop-shadow-[0_0_15px_rgba(255,255,255,0.2)]">
                    <img src="MAN.png" alt="Logo Sekolah" class="w-full h-full object-contain">
                </div>
                <div class="w-24 h-24 flex items-center justify-center drop-shadow-[0_0_15px_rgba(185,28,28,0.3)]">
                    <img src="MPK.png" alt="Logo MPK" class="w-full h-full object-contain">
                </div>
            </div>
            <h1 class="text-3xl font-bold mb-2 uppercase tracking-tight">MPK MAN Bandung Barat</h1>
            <p class="text-zinc-400">Silakan pilih tombol di bawah untuk menyampaikan aspirasi.</p>
        </header>

        <div id="main-menu" class="space-y-4">
            <button onclick="showForm('Aspirasi Berkala')" class="w-full glass p-6 rounded-2xl flex items-center gap-4 hover:bg-white/5 transition text-left group">
                <div class="bg-red-600/20 p-3 rounded-xl group-hover:scale-110 transition-transform">
                    <i data-lucide="edit-3" class="text-red-500"></i>
                </div>
                <div>
                    <h3 class="font-bold text-lg text-white">Aspirasi Berkala</h3>
                    <p class="text-sm text-zinc-400">Klik untuk mengisi form aspirasi rutin.</p>
                </div>
            </button>
            <div class="flex justify-center space-x-10 pt-8 text-zinc-500">
                <a href="https://www.instagram.com/osismpkmanbb?igsh=MWpxYTB0dmU1NG95dw==" target="_blank" class="hover:text-pink-500 text-3xl transition-all"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://mail.google.com/mail/?view=cm&fs=1&to=mpkmanbandungbarat@gmail.com" target="_blank" class="hover:text-blue-400 text-3xl transition-all"><i class="fa-solid fa-envelope"></i></a>
            </div>
        </div>

        <div id="form-section" class="hidden glass p-8 rounded-[2rem] shadow-2xl transition-all duration-500 transform">
            <button onclick="hideForm()" class="group text-zinc-500 mb-8 flex items-center gap-2 hover:text-white transition-all">
                <i data-lucide="arrow-left" class="w-4 group-hover:-translate-x-1 transition-transform"></i> 
                <span class="text-sm font-medium">Kembali</span>
            </button>
            <h2 id="form-title" class="text-3xl font-extrabold mb-8 bg-gradient-to-r from-red-500 to-red-800 bg-clip-text text-transparent">Aspirasi Berkala</h2>
            <form id="aspirasi-form" class="space-y-6">
                <input type="hidden" id="jenis_aspirasi" name="Jenis Aspirasi" value="">
                <div class="space-y-2">
                    <label class="text-xs uppercase tracking-widest text-zinc-500 font-bold ml-1">Nama Lengkap *</label>
                    <input type="text" name="Nama" required class="w-full p-4 rounded-2xl transition-all" placeholder="Masukkan nama">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="text-xs uppercase tracking-widest text-zinc-500 font-bold ml-1">Kelas *</label>
                        <select name="Kelas" required class="w-full p-4 rounded-2xl cursor-pointer">
                            <option value="" disabled selected>Pilih Kelas</option>
                            <optgroup label="Kelas 10">
                                <option>10A</option><option>10B</option><option>10C</option><option>10D</option><option>10E</option><option>10F</option><option>10G</option><option>10H</option><option>10I</option><option>10J</option><option>10K</option>
                            </optgroup>
                            <optgroup label="Kelas 11">
                                <option>11A</option><option>11B</option><option>11C</option><option>11D</option><option>11E</option><option>11F</option><option>11G</option><option>11H</option><option>11I</option><option>11J</option><option>11K</option>
                            </optgroup>
                            <optgroup label="Kelas 12">
                                <option>12A</option><option>12B</option><option>12C</option><option>12D</option><option>12E</option><option>12F</option><option>12G</option><option>12H</option><option>12I</option><option>12J</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs uppercase tracking-widest text-zinc-500 font-bold ml-1">Kategori *</label>
                        <select name="Kategori" required class="w-full p-4 rounded-2xl cursor-pointer">
                            <option value="" disabled selected>Pilih Tujuan</option>
                            <option>Sekolah</option><option>OSIS</option><option>MPK</option>
                        </select>
                    </div>
                </div>
                <div class="space-y-2">
                    <label class="text-xs uppercase tracking-widest text-zinc-500 font-bold ml-1">Isi Aspirasi *</label>
                    <textarea name="Pesan" rows="5" required class="w-full p-4 rounded-2xl transition-all resize-none" placeholder="Tuliskan aspirasimu secara mendalam..."></textarea>
                </div>
                <button type="submit" id="submit-btn" class="w-full text-white font-bold p-4 rounded-2xl transition-all active:scale-95 shadow-lg">Kirim Aspirasi</button>
            </form>
        </div>
        </div>

        <footer class="mt-20 text-center text-zinc-600 text-[10px] tracking-widest uppercase">
            &copy; 2026 MPK MAN Bandung Barat.
        </footer>
    </div>

    <div id="success-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-md"></div>
        <div class="glass border border-white/20 p-8 rounded-[2.5rem] max-w-sm w-full relative z-10 text-center transform transition-all scale-90 opacity-0" id="modal-content">
            <div class="w-20 h-20 bg-green-500/20 rounded-full flex items-center justify-center mx-auto mb-6">
                <i data-lucide="check-circle-2" class="text-green-500 w-12 h-12"></i>
            </div>
            <h3 class="text-2xl font-bold mb-2">Berhasil Terkirim!</h3>
            <p class="text-zinc-400 text-sm mb-8">Terima kasih! Aspirasi kamu telah kami terima dan akan segera ditinjau oleh tim MPK.</p>
            <button onclick="closeModal()" class="w-full bg-white text-black font-bold py-4 rounded-2xl hover:bg-zinc-200 transition-all active:scale-95">
                Selesai
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
